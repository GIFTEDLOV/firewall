name: Firewall read-only live smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FIREWALL_CONTRACT_ADDRESS: "0xEFD65978F54318349139c93c1576ED3eb6f187b6"
  FIREWALL_CHAIN_ID: "61997"
  FIREWALL_RPC_URL: "https://studio-dev.genlayer.com/api"

jobs:
  live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify canonical state with read-only RPC calls
        run: pnpm verify:live-read
